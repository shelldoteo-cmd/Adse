<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사주풀이 데모</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>사주풀이 사이트 데모</h1>
        <p class="subtitle">생년월일과 출생 시간을 입력하면 간단한 오행 기반 풀이를 확인할 수 있습니다.</p>
      </header>

      <section class="card">
        <form id="saju-form">
          <label>
            이름
            <input id="name" type="text" placeholder="홍길동" required />
          </label>

          <label>
            생년월일
            <input id="birthDate" type="date" required />
          </label>

          <label>
            출생 시간 (0~23시)
            <input id="birthHour" type="number" min="0" max="23" value="12" required />
          </label>

          <label>
            성별
            <select id="gender">
              <option value="male">남성</option>
              <option value="female">여성</option>
              <option value="other">기타</option>
            </select>
          </label>

          <button type="submit">사주 풀이 보기</button>
        </form>
      </section>

      <section id="result" class="card hidden" aria-live="polite"></section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
